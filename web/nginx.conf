server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 🔒 Опционально: Basic Auth перед тем как пускать наружу через Cloudflare Tunnel.
    # Раскомментировать после `htpasswd -c /etc/nginx/.htpasswd atom` в контейнере/volume:
    # auth_basic           "MUFCA";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://mufca-bot:8585/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://mufca-bot:8585/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
